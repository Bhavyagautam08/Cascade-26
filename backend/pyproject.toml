[project]
name = "invisible-worker"
version = "0.1.0"
description = "Offline probabilistic ledger for street vendors (Cascade '26, PS 1.2)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "faster-whisper>=1.1",
    # faster-whisper 1.2.1 decodes clips with av.open(..., metadata_errors=...), which PyAV 19 removed
    "av>=11,<19",
    "pillow>=10",   # slip photos: EXIF orientation, rotation, resizing
    "sounddevice>=0.5",
    "ollama>=0.4",
    "httpx>=0.27",
    # CUDA 12 runtime libs for CTranslate2 (faster-whisper) on Windows
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
